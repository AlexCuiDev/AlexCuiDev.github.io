<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 | 崔小建 | CATIA二次开发 & BIM开发工程师</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --border: #30363d;
            --radius: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            padding-top: 70px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(13,17,23,0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 999;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 24px;
            font-size: 15px;
            transition: 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }

        /* 移动端导航优化 */
        @media (max-width: 768px) {
            .nav-links {
                display: flex;
                overflow-x: auto;
                padding: 0 10px;
                scrollbar-width: none;
            }
            .nav-links::-webkit-scrollbar {
                display: none;
            }
            .nav-links a {
                margin-left: 12px;
                font-size: 14px;
                white-space: nowrap;
            }
        }

        .blog-hero {
            padding: 40px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 60px;
        }

        .blog-hero h1 {
            font-size: 36px;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .blog-hero p {
            color: var(--text-secondary);
            font-size: 18px;
            max-width: 800px;
        }

        .blog-list {
            max-width: 800px;
            margin: 0 auto 80px;
        }

        .blog-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 30px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .blog-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.1);
        }

        .blog-card:focus-within {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .blog-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
            flex-wrap: wrap; /* 移动端标签换行 */
        }

        .blog-meta .tag {
            background: rgba(88, 166, 255, 0.1);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .blog-card h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .blog-card h2 a {
            color: inherit;
            text-decoration: none;
        }

        .blog-card h2 a:hover {
            color: var(--accent);
        }

        .blog-excerpt {
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .blog-readmore {
            display: inline-block;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: 0.2s;
        }

        .blog-readmore:hover {
            text-decoration: underline;
        }

        footer {
            padding:40px 0; 
            border-top:1px solid var(--border); 
            text-align:center; 
            color:var(--text-secondary);
            margin-top: 80px;
        }

        /* 加载动画样式 */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(88, 166, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 错误提示样式 */
        .error-message {
            color: #f87171;
            text-align: center;
            padding: 20px;
        }

        .retry-btn {
            background: var(--bg-secondary);
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 16px;
            margin-top: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .retry-btn:hover {
            border-color: var(--accent);
            background: rgba(88, 166, 255, 0.1);
        }

        @media (max-width: 768px) {
            .blog-hero h1 {
                font-size: 28px;
            }
            .blog-card {
                padding: 20px;
            }
            .blog-card h2 {
                font-size: 20px;
            }
            .blog-excerpt {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="container nav">
            <div class="logo">AlexCuiDev</div>
            <div class="nav-links">
                <a href="../index.html#home">首页</a>
                <a href="../index.html#about">关于我</a>
                <a href="../index.html#skills">技能</a>
                <a href="../index.html#experience">经历</a>
                <a href="../index.html#works">成果展示</a>
                <a href="index.html" class="active">博客</a>
                <a href="https://github.com/AlexCuiDev" target="_blank">GitHub</a>
            </div>
        </div>
    </header>

    <section class="blog-hero">
        <div class="container">
            <h1>我的技术博客</h1>
            <p>分享 CATIA 二次开发、BIM 正向设计、工程数字化的技术实践与思考</p>
        </div>
    </section>

    <section class="container">
        <div class="blog-list" id="postList">
            <p style="text-align:center; color:var(--text-secondary);">
                <span class="loading-spinner"></span>正在加载文章...
            </p>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>崔小建 | CATIA二次开发 & BIM开发工程师 | 中国上海</p>
            <p style="margin-top:8px">© 2026 AlexCuiDev</p>
        </div>
    </footer>

    <script>
        // 增强版全自动博客加载方案
        // 特性：自动识别、容错处理、加载状态、重试机制、无障碍支持
        async function autoLoadAllPosts() {
            const listEl = document.getElementById("postList");
            const postList = [];

            // 工具函数：安全提取内容
            const safeExtract = (html, regex) => {
                try {
                    const match = html.match(regex);
                    return match ? match[1].trim() : '';
                } catch (e) {
                    return '';
                }
            };

            // 重置加载状态
            listEl.innerHTML = `
                <p style="text-align:center; color:var(--text-secondary);">
                    <span class="loading-spinner"></span>正在加载文章...
                </p>
            `;

            try {
                // 1. 尝试获取posts目录下所有HTML文件（兼容不同服务器配置）
                let htmlFiles = [];
                try {
                    const response = await fetch('posts/', { 
                        method: 'GET',
                        headers: {
                            'Accept': 'text/html'
                        }
                    });
                    
                    if (response.ok) {
                        const text = await response.text();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(text, 'text/html');
                        const links = doc.querySelectorAll('a[href$=".html"]');
                        
                        // 去重+过滤无效链接+处理相对路径
                        htmlFiles = Array.from(links)
                            .map(link => link.getAttribute('href'))
                            .filter(href => href && href.endsWith('.html'))
                            .map(href => {
                                // 处理绝对路径/相对路径
                                if (href.startsWith('/')) href = href.substring(1);
                                if (href.startsWith('posts/')) href = href.replace('posts/', '');
                                return href;
                            })
                            .filter((file, index, self) => self.indexOf(file) === index);
                    } else {
                        // 服务器不允许目录访问时，尝试备用方案（手动指定常见文件名格式）
                        console.warn('服务器禁止目录访问，尝试备用加载方案');
                    }
                } catch (e) {
                    console.warn('目录访问失败，尝试备用加载方案：', e);
                }

                // 备用方案：如果无法读取目录，可手动添加文章文件名（按需修改）
                if (htmlFiles.length === 0) {
                    // 示例：手动添加文章列表（取消注释并修改为实际文件名）
                    // htmlFiles = [
                    //     '2026-01-01-catia二次开发入门.html',
                    //     '2026-01-10-bim正向设计实践.html'
                    // ];
                }

                if (htmlFiles.length === 0) {
                    listEl.innerHTML = `
                        <p class="error-message">未检测到文章文件</p>
                        <p style="text-align:center; color:var(--text-secondary);">
                            请检查posts文件夹是否存在，或是否包含HTML格式的文章
                        </p>
                    `;
                    return;
                }

                // 2. 批量解析文章信息（带容错）
                for (const file of htmlFiles) {
                    try {
                        // 处理路径，避免重复的posts/前缀
                        const filePath = file.startsWith('posts/') ? file : `posts/${file}`;
                        const res = await fetch(filePath);
                        
                        if (!res.ok) {
                            console.warn(`无法访问文章文件: ${filePath}`);
                            continue;
                        }
                        
                        const html = await res.text();
                        const lowerHtml = html.toLowerCase();

                        // 自动提取标题（多规则兼容）
                        let title = safeExtract(html, /<title>([\s\S]*?)<\/title>/i) || 
                                    safeExtract(html, /<h1 class=["']?post-title["']?>([\s\S]*?)<\/h1>/i) ||
                                    safeExtract(html, /<h1>([\s\S]*?)<\/h1>/i) ||
                                    file.replace(/\.html$/, '').replace(/-/g, ' ').replace(/^\d+-\d+-\d+-/, '');
                        // 清理标题后缀
                        title = title.replace(/\|.*$/, '').replace(/-{2,}/g, ' ').trim() || '未命名文章';

                        // 自动提取日期（多规则兼容）
                        let date = safeExtract(html, /publish-date["']?\s*:\s*["']([0-9\-]+)["']/i) ||
                                   safeExtract(html, /<meta name=["']publish-date["'] content=["']([0-9\-]+)["']/i) ||
                                   safeExtract(html, /发布时间[:：]\s*([0-9\-]+)/i) ||
                                   safeExtract(html, /<time.*?datetime=["']([0-9\-]+)["']/i) ||
                                   // 从文件名提取日期（兼容 yyyy-mm-dd-标题.html 格式）
                                   (file.match(/^(\d{4}-\d{2}-\d{2})-/) ? file.match(/^(\d{4}-\d{2}-\d{2})-/)[1] : '2026-01-01');

                        // 验证日期格式
                        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
                            date = '2026-01-01';
                        }

                        // 自动提取标签
                        let tag = safeExtract(html, /<meta name=["']tag["'] content=["']([^"']+)["']/i) ||
                                  safeExtract(html, /<meta name=["']keywords["'] content=["']([^"']+)["']/i) ||
                                  safeExtract(html, /标签[:：]\s*([^<]+)/i) || '技术笔记';
                        // 只取第一个标签（避免标签过多）
                        tag = tag.split(',')[0].trim() || '技术笔记';

                        // 自动提取摘要（优化优先级）
                        let desc = safeExtract(html, /<meta name=["']description["'] content=["']([\s\S]{1,160})["']/i) ||
                                   safeExtract(html, /<div class=["']?post-excerpt["']?>([\s\S]{1,160})<\/div>/i) ||
                                   safeExtract(html, /<p class=["']?excerpt["']?>([\s\S]{1,160})<\/p>/i);
                        
                        // 备用方案：纯文本截取（优化清理规则）
                        if (!desc) {
                            const textOnly = html.replace(/<script[\s\S]*?<\/script>/gi, '')
                                                .replace(/<style[\s\S]*?<\/style>/gi, '')
                                                .replace(/<[^>]+>/g, ' ')
                                                .replace(/\s+/g, ' ')
                                                .trim();
                            desc = textOnly.slice(0, 160) || '暂无摘要';
                        }
                        // 清理HTML实体和多余空格
                        desc = desc.replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
                                   .replace(/&amp;/g, '&').trim();
                        desc += desc.length >= 160 ? '...' : '';

                        postList.push({ file, title, date, tag, desc });
                    } catch (e) {
                        console.warn(`解析文章 ${file} 失败：`, e);
                        continue;
                    }
                }

                // 3. 按日期排序（最新在前）
                postList.sort((a, b) => new Date(b.date) - new Date(a.date));

                // 4. 生成博客卡片
                listEl.innerHTML = '';
                
                if (postList.length === 0) {
                    listEl.innerHTML = `
                        <p style="text-align:center; color:var(--text-secondary);">
                            📝 暂无发布的文章，敬请期待
                        </p>
                    `;
                    return;
                }

                postList.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'blog-card';
                    card.tabIndex = 0; // 无障碍支持：允许键盘聚焦
                    card.setAttribute('aria-label', `博客文章：${p.title}，发布于${p.date}，标签：${p.tag}`);
                    
                    card.innerHTML = `
                        <div class="blog-meta">
                            <time datetime="${p.date}">${p.date}</time>
                            <span class="tag">${p.tag}</span>
                        </div>
                        <h2><a href="posts/${p.file}" aria-label="阅读文章：${p.title}">${p.title}</a></h2>
                        <div class="blog-excerpt">${p.desc}</div>
                        <a href="posts/${p.file}" class="blog-readmore" aria-label="阅读${p.title}全文">阅读全文 →</a>
                    `;
                    
                    // 点击卡片跳转（增强体验）
                    card.addEventListener('click', (e) => {
                        if (!e.target.closest('a')) {
                            window.location.href = `posts/${p.file}`;
                        }
                    });
                    
                    listEl.appendChild(card);
                });

            } catch (e) {
                console.error('加载文章列表失败：', e);
                listEl.innerHTML = `
                    <p class="error-message">加载文章失败 😞</p>
                    <p style="text-align:center; color:var(--text-secondary);">
                        请检查网络连接或posts文件夹路径是否正确
                    </p>
                    <div style="text-align:center; margin-top:10px;">
                        <button class="retry-btn" onclick="autoLoadAllPosts()">重试加载</button>
                    </div>
                `;
            }
        }

        // 页面加载完成后自动运行
        window.addEventListener('DOMContentLoaded', autoLoadAllPosts);
        
        // 暴露重试函数到全局
        window.autoLoadAllPosts = autoLoadAllPosts;
    </script>
</body>
</html>
