<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 | 崔小建 | CATIA二次开发 & BIM开发工程师</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --border: #30363d;
            --radius: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            padding-top: 70px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(13,17,23,0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 999;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 24px;
            font-size: 15px;
            transition: 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }

        .blog-hero {
            padding: 40px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 60px;
        }

        .blog-hero h1 {
            font-size: 36px;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .blog-hero p {
            color: var(--text-secondary);
            font-size: 18px;
            max-width: 800px;
        }

        .blog-list {
            max-width: 800px;
            margin: 0 auto 80px;
        }

        .blog-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 30px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        .blog-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.1);
        }

        .blog-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .blog-meta .tag {
            background: rgba(88, 166, 255, 0.1);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .blog-card h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .blog-card h2 a {
            color: inherit;
            text-decoration: none;
        }

        .blog-card h2 a:hover {
            color: var(--accent);
        }

        .blog-excerpt {
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .blog-readmore {
            display: inline-block;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: 0.2s;
        }

        .blog-readmore:hover {
            text-decoration: underline;
        }

        footer {
            padding:40px 0; 
            border-top:1px solid var(--border); 
            text-align:center; 
            color:var(--text-secondary);
            margin-top: 80px;
        }

        /* 加载动画样式（新增，不改变布局） */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(88, 166, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .nav-links a {
                margin-left: 12px;
                font-size: 14px;
            }
            .blog-hero h1 {
                font-size: 28px;
            }
            .blog-card {
                padding: 20px;
            }
            .blog-card h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="container nav">
            <div class="logo">AlexCuiDev</div>
            <div class="nav-links">
                <a href="../index.html#home">首页</a>
                <a href="../index.html#about">关于我</a>
                <a href="../index.html#skills">技能</a>
                <a href="../index.html#experience">经历</a>
                <a href="../index.html#works">成果展示</a>
                <a href="index.html" class="active">博客</a>
                <a href="https://github.com/AlexCuiDev" target="_blank">GitHub</a>
            </div>
        </div>
    </header>

    <section class="blog-hero">
        <div class="container">
            <h1>我的技术博客</h1>
            <p>分享 CATIA 二次开发、BIM 正向设计、工程数字化的技术实践与思考</p>
        </div>
    </section>

    <section class="container">
        <div class="blog-list" id="postList">
            <!-- 优化加载提示（新增加载动画，不改变布局） -->
            <p style="text-align:center; color:var(--text-secondary);">
                <span class="loading-spinner"></span>正在加载文章...
            </p>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>崔小建 | CATIA二次开发 & BIM开发工程师 | 中国上海</p>
            <p style="margin-top:8px">© 2026 AlexCuiDev</p>
        </div>
    </footer>

    <script>
        // ==============================================
        // 增强版全自动方案：零配置、高容错、多维度自动提取
        // 1. 自动识别posts目录所有HTML文章
        // 2. 自动提取标题/日期/标签/摘要（多规则兼容）
        // 3. 容错处理+加载状态优化
        // 4. 完全保留原有布局和样式
        // ==============================================
        async function autoLoadAllPosts() {
            const listEl = document.getElementById("postList");
            const postList = [];

            // 工具函数：安全提取内容
            const safeExtract = (html, regex) => {
                try {
                    const match = html.match(regex);
                    return match ? match[1].trim() : '';
                } catch (e) {
                    return '';
                }
            };

            try {
                // 1. 自动获取posts目录下所有HTML文件（兼容不同服务器目录展示格式）
                const response = await fetch('posts/');
                if (!response.ok) throw new Error('无法访问posts目录');
                
                const text = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const links = doc.querySelectorAll('a[href$=".html"]');
                
                // 去重+过滤无效链接
                const htmlFiles = Array.from(links)
                    .map(link => link.getAttribute('href'))
                    .filter(href => href && href.endsWith('.html'))
                    .filter((file, index, self) => self.indexOf(file) === index);

                // 2. 批量解析文章信息（带容错）
                for (const file of htmlFiles) {
                    try {
                        const res = await fetch(`posts/${file}`);
                        if (!res.ok) continue;
                        
                        const html = await res.text();
                        const lowerHtml = html.toLowerCase();

                        // 自动提取标题（多规则兼容）
                        let title = safeExtract(html, /<title>([\s\S]*?)<\/title>/i) || 
                                    safeExtract(html, /<h1 class=["']post-title["']>([\s\S]*?)<\/h1>/i) ||
                                    file.replace(/\.html$/, '').replace(/-/g, ' ').replace(/^\d+-\d+-\d+-/, '');
                        // 清理标题后缀
                        title = title.replace(/\|.*$/, '').replace(/-{2,}/g, ' ').trim() || '未命名文章';

                        // 自动提取日期（多规则兼容）
                        let date = safeExtract(html, /publish-date["']?\s*:\s*["']([0-9\-]+)["']/i) ||
                                   safeExtract(html, /<meta name=["']publish-date["'] content=["']([0-9\-]+)["']/i) ||
                                   safeExtract(html, /发布时间：([0-9\-]+)/i) ||
                                   // 从文件名提取日期（兼容 yyyy-mm-dd-标题.html 格式）
                                   (file.match(/^(\d{4}-\d{2}-\d{2})-/) ? file.match(/^(\d{4}-\d{2}-\d{2})-/)[1] : '2026-01-01');

                        // 自动提取标签（新增，不改变布局）
                        let tag = safeExtract(html, /<meta name=["']tag["'] content=["']([^"']+)["']/i) ||
                                  safeExtract(html, /标签：([^<]+)/i) || '技术笔记';

                        // 自动提取摘要（优化：优先提取专门的摘要标签，再提取正文）
                        let desc = safeExtract(html, /<meta name=["']description["'] content=["']([\s\S]{1,160})["']/i) ||
                                   safeExtract(html, /<div class=["']post-excerpt["']>([\s\S]{1,160})<\/div>/i);
                        // 备用方案：纯文本截取（优化清理规则）
                        if (!desc) {
                            const textOnly = html.replace(/<script[\s\S]*?<\/script>/gi, '')
                                                .replace(/<style[\s\S]*?<\/style>/gi, '')
                                                .replace(/<[^>]+>/g, ' ')
                                                .replace(/\s+/g, ' ')
                                                .trim();
                            desc = textOnly.slice(0, 160) || '暂无摘要';
                        }
                        desc += desc.length >= 160 ? '...' : '';

                        postList.push({ file, title, date, tag, desc });
                    } catch (e) {
                        console.warn(`解析文章 ${file} 失败：`, e);
                        continue;
                    }
                }

                // 3. 按日期排序（最新在前）
                postList.sort((a, b) => new Date(b.date) - new Date(a.date));

                // 4. 生成博客卡片（完全保留原有布局）
                listEl.innerHTML = '';
                if (postList.length === 0) {
                    listEl.innerHTML = '<p style="text-align:center; color:var(--text-secondary);">暂无文章</p>';
                    return;
                }

                postList.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'blog-card';
                    card.innerHTML = `
                        <div class="blog-meta">
                            <span>${p.date}</span>
                            <span class="tag">${p.tag}</span>
                        </div>
                        <h2><a href="posts/${p.file}">${p.title}</a></h2>
                        <div class="blog-excerpt">${p.desc}</div>
                        <a href="posts/${p.file}" class="blog-readmore">阅读全文 →</a>
                    `;
                    listEl.appendChild(card);
                });

            } catch (e) {
                console.error('加载文章列表失败：', e);
                listEl.innerHTML = `
                    <p style="text-align:center; color:var(--text-secondary);">
                        加载失败 → 请检查posts文件夹是否存在，或服务器是否允许访问目录
                    </p>
                `;
            }
        }

        // 页面加载完成后自动运行（保留原有逻辑）
        window.addEventListener('DOMContentLoaded', autoLoadAllPosts);
    </script>
</body>
</html>
