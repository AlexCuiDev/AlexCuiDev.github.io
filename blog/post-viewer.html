<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章阅读</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
        background:#1e1e2e;
        color:#cdd6f4;
        font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
        line-height:1.7;
        padding:30px 20px;
    }
    .container{
        max-width:960px;
        margin:0 auto;
    }
   .back {
        margin-bottom: 20px;
        /* 固定定位关键代码 */
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(30, 30, 46, 0.9);
        padding: 8px 12px;
        border-radius: 6px;
        backdrop-filter: blur(5px);
        z-index: 999;
    }
    .back a{
        color:#89b4fa;
        text-decoration:none;
        font-size:16px;
    }
    .content{
        background:#181825;
        padding:30px;
        border-radius:12px;
        border:1px solid #313244;
    }
    h1{margin-bottom:20px;font-size:26px}
    p{margin-bottom:16px}
    img{max-width:100%;border-radius:8px;margin:10px 0}
    pre{
        background:#11111b;
        padding:15px;
        border-radius:6px;
        overflow-x:auto;
        margin:15px 0;
    }
    blockquote{
        border-left:4px solid #89b4fa;
        padding-left:15px;
        color:#a6adc8;
        margin:15px 0;
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="container">
    <div class="back">
        <a href="index.html">← 返回博客列表</a>
    </div>
    <div class="content" id="content">
        加载中...
    </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const filename = urlParams.get('file');

if (!filename) {
    document.getElementById('content').innerHTML = '没有找到文章';
} else {
    fetch(`posts/${filename}`)
    .then(res => res.text())
    .then(md => {
        // 自动把图片指向 assets
       md = md.replace(/!\[.*?\]\(\/blog\/assets\/(.*?)\)/g, `![$1](assets/$1)`);
        document.getElementById('content').innerHTML = marked.parse(md);
    })
    .catch(e => {
        document.getElementById('content').innerHTML = '加载失败：' + e.message;
    });
}
</script>
</body>
</html>
